name: 스윙매매 자동 분석 알림

on:
  schedule:
    # 한국시간(KST) 오후 3시 40분 = UTC 오전 6시 40분 (월~금만 실행)
    - cron: '40 6 * * 1-5'
  workflow_dispatch: # 깃허브 웹에서 수동으로 실행할 수 있는 버튼 생성

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 불러오기
      uses: actions/checkout@v3

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 필수 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy finance-datareader requests

    - name: 분석 코드 실행 및 텔레그램 전송
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python main.py
